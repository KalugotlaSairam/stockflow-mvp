{% extends "base.html" %}

{% block title %}Settings | StockFlow{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <h1 class="fw-bold mb-2">Settings</h1>

        <p class="text-muted mb-4">
            Configure inventory settings for {{ organization.name }}.
        </p>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <h5 class="fw-bold mb-3">
                    Low-Stock Threshold
                </h5>

                <p class="text-muted small">
                    Products without a custom threshold will use
                    this organization-wide default.
                </p>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Default Low-Stock Threshold
                        </label>

                        <input
                            type="number"
                            name="default_low_stock_threshold"
                            class="form-control"
                            min="0"
                            max="1000000"
                            step="1"
                            required
                            value="{{ organization.default_low_stock_threshold }}"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Save Settings
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
